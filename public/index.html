<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Medi Study · 도덕경 문서 챗봇</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/chat.js" defer></script>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="/" aria-label="Medi Study 홈">Medi Study</a>
      <a class="source-link" href="https://drive.google.com/file/d/1yXLG3D3L2dCd7Nd6vvp7lkb1GQZOfW4q/view" target="_blank" rel="noopener noreferrer">참고 문서 열기 ↗</a>
    </header>
    <section class="intro" aria-labelledby="heading">
      <h1 id="heading">도덕경에 대해<br>무엇이 궁금한가요?</h1>
      <p>문서에서 관련 내용을 찾아 답하고, 확인에 필요한 출처를 함께 보여드립니다.</p>
    </section>
    <section aria-label="대화" id="conversation" role="log" aria-live="polite"></section>
    <form id="composer">
      <label for="question">문서에 질문하기</label>
      <textarea id="question" maxlength="1500" rows="2" required placeholder="예: 1장에서 ‘도’와 ‘이름’을 어떻게 설명하나요?"></textarea>
      <div class="actions">
        <button type="button" id="reset" hidden>새 대화</button>
        <button type="submit" id="send">질문 보내기 <span aria-hidden="true">↑</span></button>
      </div>
      <p id="status" role="status"></p>
    </form>
  </main>
</body>
</html>
